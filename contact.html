<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="section">
    <h2>Customer Enquiry Form</h2>

    <form id="myForm">

        <fieldset>
            <legend>Customer Details</legend>

            Name:<br>
            <input type="text" id="name"><br><br>

            Phone:<br>
            <input type="tel" id="phone"><br><br>

        </fieldset>

        <fieldset>
            <legend>Product Selection</legend>

            Select Product:<br>
            <select id="product" onchange="productChanged()">
                <option>Saree</option>
                <option>Kurti</option>
                <option>Suiting & Shirting</option>
            </select>
            <br><br>

            Select Quantity:<br>
            <select id="quantity" size="3">
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
            Choose Preferred Colors:<br>
            <select size="3">
            <option>Red</option>
            <option>Blue</option>
            <option>Green</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Feedback</legend>

            Review:<br>
            <textarea id="review" rows="4" cols="25"></textarea>

        </fieldset>

        <br>

        <button type="button" onclick="submitForm()">Submit</button>
        <button type="button" onclick="resetForm()">Reset</button>

    </form>
</div>
<h1>Contact us: 9893159671<br>8770507722</h1>
</body>
</html>
